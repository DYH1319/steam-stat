name: Build and Release (Electron.NET)

on:
  push:
    tags:
      - 'v*.*.*' # 匹配 v1.0.0, v2.1.3 等版本号格式

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: pwsh
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/ElectronNet.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows application using build-win.ps1
        shell: pwsh
        run: |
          .\scripts\build-win.ps1

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: ${{ github.ref_name }}
          body: |
            ### 🚀 Features

            ### 🐛 Bug Fixes

            ### 📝 更新日志
            查看 [所有提交记录](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          files: |
            release/Steam-Stat-Setup-*.exe*
            release/*.yml
            !release/builder-debug.yml
          token: ${{ secrets.PAT_TOKEN }}
