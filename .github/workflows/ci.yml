name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: pnpm run lint:ci

      - name: Build frontend
        run: pnpm run build

  core-tests:
    name: Core tests (no Electron)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run isolated Core tests
        run: dotnet test backend/tests/SteamStat.Core.Tests/SteamStat.Core.Tests.csproj -c Debug

  ipc-contracts:
    name: IPC contracts (generated files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check generated IPC contracts
        run: dotnet run --project tools/GenerateIpcContracts -- --check

  backend:
    name: Backend (build + test)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SteamStat.slnx -p:ElectronSkipExecCommands=true

      - name: Build
        run: dotnet build SteamStat.slnx -c Debug --no-restore -p:ElectronSkipExecCommands=true

      - name: Test
        run: dotnet test SteamStat.slnx -c Debug --no-build -p:ElectronSkipExecCommands=true --logger "console;verbosity=normal"

      - name: Enforce architecture rules
        run: dotnet test backend/tests/SteamStat.Architecture.Tests/SteamStat.Architecture.Tests.csproj -c Debug --no-build -p:ElectronSkipExecCommands=true --logger "console;verbosity=normal"

      - name: Report NuGet vulnerabilities
        run: dotnet list ElectronNet/ElectronNet/ElectronNet.csproj package --vulnerable --include-transitive
